<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" role="img" aria-labelledby="title description">
  <title id="title">Telegram Agent reviewed delivery pipeline</title>
  <desc id="description">The pipeline moves from intake to plan, critique, build, test, fresh review, documentation, final test, final review, owner approval, merge, deployment, canary, and completion. Critique can return to planning. Test and review findings enter a bounded patch loop. Invalid or exhausted evidence blocks the job.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1280" height="740" rx="24" fill="#ffffff"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="34" y="32" width="1212" height="176" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="62" y="66" font-size="13" font-weight="800" letter-spacing="1.5" fill="#2563eb">DESIGN</text>

    <rect x="34" y="228" width="1212" height="254" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="62" y="262" font-size="13" font-weight="800" letter-spacing="1.5" fill="#7c3aed">DELIVERY</text>

    <rect x="34" y="502" width="1212" height="204" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="62" y="536" font-size="13" font-weight="800" letter-spacing="1.5" fill="#475569">RELEASE</text>

    <!-- Design stages -->
    <g filter="url(#shadow)">
      <rect x="112" y="92" width="160" height="76" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
      <rect x="332" y="92" width="160" height="76" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
      <rect x="552" y="92" width="160" height="76" rx="13" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    </g>
    <text x="192" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Intake</text>
    <text x="192" y="149" text-anchor="middle" font-size="11.5" fill="#64748b">bounded work order</text>
    <text x="412" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Plan</text>
    <text x="412" y="149" text-anchor="middle" font-size="11.5" fill="#64748b">immutable artifact</text>
    <text x="632" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Critique</text>
    <text x="632" y="149" text-anchor="middle" font-size="11.5" fill="#64748b">fresh conversation</text>

    <line x1="274" y1="130" x2="326" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="494" y1="130" x2="546" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 552 108 C 520 60, 450 54, 412 86" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
    <text x="480" y="57" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">one revision</text>

    <!-- Accepted-plan handoff -->
    <path d="M 714 130 H 1200 V 272 H 142 V 286" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1020" y="205" width="144" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1092" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">accepted plan</text>

    <!-- Delivery stages -->
    <g filter="url(#shadow)">
      <rect x="72" y="292" width="140" height="76" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="272" y="292" width="140" height="76" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="472" y="292" width="140" height="76" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="672" y="292" width="140" height="76" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="872" y="292" width="140" height="76" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="1072" y="292" width="140" height="76" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    </g>
    <text x="142" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Build</text>
    <text x="142" y="349" text-anchor="middle" font-size="11" fill="#64748b">plan executor</text>
    <text x="342" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Test</text>
    <text x="342" y="349" text-anchor="middle" font-size="11" fill="#64748b">deterministic gates</text>
    <text x="542" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Review</text>
    <text x="542" y="349" text-anchor="middle" font-size="11" fill="#64748b">fresh conversation</text>
    <text x="742" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Docs</text>
    <text x="742" y="349" text-anchor="middle" font-size="11" fill="#64748b">documented behavior</text>
    <text x="942" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Final test</text>
    <text x="942" y="347" text-anchor="middle" font-size="11" fill="#64748b">current head SHA</text>
    <text x="1142" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Final review</text>
    <text x="1142" y="347" text-anchor="middle" font-size="11" fill="#64748b">fresh conversation</text>

    <line x1="214" y1="330" x2="266" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="414" y1="330" x2="466" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="614" y1="330" x2="666" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="814" y1="330" x2="866" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1014" y1="330" x2="1066" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Bounded remediation bus -->
    <line x1="342" y1="370" x2="342" y2="405" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="542" y1="370" x2="542" y2="405" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="942" y1="370" x2="942" y2="405" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="1142" y1="370" x2="1142" y2="405" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="342" y1="405" x2="1020" y2="405" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
    <text x="682" y="398" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">failed test or requested review changes</text>

    <rect x="1028" y="390" width="136" height="48" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="1096" y="420" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Patch</text>
    <path d="M 1028 428 H 246 V 382 H 342 V 374" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="610" y="452" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">bounded loop · new head requires new evidence</text>

    <!-- Release handoff and stages -->
    <path d="M 1214 330 H 1228 V 556 H 142 V 568" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1014" y="492" width="176" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1102" y="508" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">current SHA + all gates</text>

    <g filter="url(#shadow)">
      <rect x="72" y="574" width="160" height="76" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <rect x="292" y="574" width="160" height="76" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <rect x="512" y="574" width="160" height="76" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <rect x="732" y="574" width="160" height="76" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <rect x="952" y="574" width="160" height="76" rx="13" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    </g>
    <text x="152" y="605" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Owner approval</text>
    <text x="152" y="630" text-anchor="middle" font-size="11" fill="#92400e">one-use · expiring</text>
    <text x="372" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Merge</text>
    <text x="372" y="630" text-anchor="middle" font-size="11" fill="#64748b">repository rules apply</text>
    <text x="592" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Deploy</text>
    <text x="592" y="630" text-anchor="middle" font-size="11" fill="#64748b">separate receipt</text>
    <text x="812" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Canary</text>
    <text x="812" y="630" text-anchor="middle" font-size="11" fill="#64748b">separate receipt</text>
    <text x="1032" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Complete</text>
    <text x="1032" y="630" text-anchor="middle" font-size="11" fill="#15803d">truthful final status</text>

    <line x1="234" y1="612" x2="286" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="454" y1="612" x2="506" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="674" y1="612" x2="726" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="894" y1="612" x2="946" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Fail-closed outcome -->
    <path d="M 1166 414 H 1238 V 682 H 1230" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
    <rect x="1088" y="662" width="136" height="40" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="1156" y="687" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Blocked</text>
    <text x="1048" y="686" text-anchor="end" font-size="10.5" fill="#b91c1c">invalid or exhausted evidence</text>
  </g>
</svg>
